name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=0.1.0" >> "$GITHUB_OUTPUT"
          fi
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build and Package App
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          BUILD_NUMBER: ${{ steps.version.outputs.BUILD_NUMBER }}
        run: |
          chmod +x scripts/build-app.sh scripts/package-release.sh
          ./scripts/package-release.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Scribe-${{ steps.version.outputs.VERSION }}-macos
          path: dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Scribe-${{ steps.version.outputs.VERSION }}-macos.zip
            dist/Scribe-${{ steps.version.outputs.VERSION }}.dmg
            dist/SHA256SUMS.txt
          generate_release_notes: true
